# ===================================================================
# Smart Vehicle Service & Management System - Spring Boot Config
# ===================================================================
server.port=8080
spring.application.name=smart-vehicle-service-backend

# --- MySQL Operational Database Configuration ---
spring.datasource.url=jdbc:mysql://localhost:3306/smart_vehicle_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT Security Configuration ---
app.jwt.secret=SmartVehicleServiceManagementSystemSecretKey2026ForJwtSigning!
app.jwt.expiration-ms=86400000

# --- Notification Scheduler Cron (Runs daily at 08:00 AM) ---
app.scheduler.expiry-check-cron=0 0 8 * * ?
